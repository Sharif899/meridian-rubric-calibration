[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-rubric-calibration"
version = "0.1.0"
description = "Enterprise LLM rubric evaluation and calibration system: versioned rubrics, blinded human grading, LLM-grader comparison and agreement analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sherif Olabode" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
meridian = "meridian_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
